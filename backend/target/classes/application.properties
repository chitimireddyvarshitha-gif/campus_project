# ===================================================================
# CAMPUS EVENT MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=

# Spring Application Name
spring.application.name=campus-event-management

# MySQL Database Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/campus_event_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
# 256-bit Hex Key for HMAC-SHA256 signature
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# CORS Configuration (React Vite Frontend)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000

# Logging
logging.level.com.campusevent.management=INFO
logging.level.org.springframework.security=WARN
